<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practical 13 - Events API</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:0 16px;color:#172033}.event{padding:14px;margin:10px 0;border:1px solid #dbe2ec;border-radius:10px}button{padding:9px 13px;border:0;background:#3157d5;color:white;border-radius:7px}</style><h1>Campus Events API</h1><p>This page calls <code>api/events.php</code> using Fetch. Run it through Apache and open this page from localhost.</p><button id="reload">Load events</button><p id="status" aria-live="polite"></p><div id="events"></div><script>
const box=document.querySelector('#events'), status=document.querySelector('#status');
async function loadEvents(){status.textContent='Loading events…';box.replaceChildren();try{const response=await fetch('api/events.php');if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.success)throw new Error(result.message||'API error');status.textContent=`Loaded ${result.data.length} event(s).`;result.data.forEach(event=>{const card=document.createElement('article');card.className='event';const title=document.createElement('h2');title.textContent=event.title;const detail=document.createElement('p');detail.textContent=`${event.event_date} · ${event.category} · ${event.venue}`;card.append(title,detail);if(event.description){const desc=document.createElement('p');desc.textContent=event.description;card.append(desc)}box.append(card)});}catch(error){status.textContent='Could not load events. Check Apache, database setup, and api/events.php.';console.error(error)}}document.querySelector('#reload').addEventListener('click',loadEvents);loadEvents();
</script></html>
